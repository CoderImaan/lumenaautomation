<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <meta name="theme-color" content="#071018">
  <link rel="icon" href="/assets/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon-180x180.png">
  <link rel="manifest" href="/assets/img/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/lumena.css">
  {% for style in page.styles %}<link rel="stylesheet" href="{{ style }}">{% endfor %}
  {% include analytics.html %}
</head>
<body data-page="{{ page.page_id | default: page.name | escape }}"{% if page.body_class %} class="{{ page.body_class | escape }}"{% endif %}>
  {% include navbar.html %}
  <div id="main-content" tabindex="-1">{{ content }}</div>
  {% include footer.html %}
  <button id="backToTop" class="back-to-top" type="button" aria-label="Back to top"><span aria-hidden="true">↑</span></button>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js" defer></script>
  <script src="/assets/js/lumena.js" defer></script>
  {% for script in page.scripts %}<script src="{{ script }}" defer></script>{% endfor %}
</body>
</html>
