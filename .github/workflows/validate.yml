name: Validate Jekyll site
on:
  pull_request:
  push:
    branches: [master, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").each { |path| YAML.parse_file(path); puts "Valid YAML #{path}" }'
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate generated pages, assets, links, and domain files
        run: python3 scripts/validate_site.py ./_site
