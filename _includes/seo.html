<title>{{ page.title | default: site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<meta name="robots" content="{{ page.robots | default: 'index, follow' }}">
<meta name="author" content="LumenaAutomation">
{% if page.keywords %}<meta name="keywords" content="{{ page.keywords | escape }}">{% endif %}
<link rel="canonical" href="{{ page.canonical_url | default: page.url | absolute_url | escape }}">
<meta property="og:site_name" content="LumenaAutomation">
<meta property="og:type" content="{% if page.og_type %}{{ page.og_type }}{% elsif page.url contains '/blogs/' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.og_title | default: page.title | escape }}">
<meta property="og:description" content="{{ page.og_description | default: page.description | escape }}">
<meta property="og:url" content="{{ page.canonical_url | default: page.url | absolute_url | escape }}">
<meta property="og:image" content="{{ page.og_image | default: '/assets/img/lumena-automation-og-1200x630.png' | absolute_url | escape }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.twitter_title | default: page.og_title | default: page.title | escape }}">
<meta name="twitter:description" content="{{ page.twitter_description | default: page.og_description | default: page.description | escape }}">
<meta name="twitter:image" content="{{ page.og_image | default: '/assets/img/lumena-automation-og-1200x630.png' | absolute_url | escape }}">
